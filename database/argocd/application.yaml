apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: database
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  # Le projet homelab-platform (défini dans database/argocd/project.yaml depuis
  # le retrait de object-store en phase 5) admet le namespace `database`.
  project: homelab-platform
  source:
    repoURL: https://github.com/hseb72/homelab-platform.git
    targetRevision: main
    path: database
    helm:
      releaseName: database
      valueFiles:
        - values.yaml
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: database
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff: { duration: 15s, factor: 2, maxDuration: 5m }
  ignoreDifferences:
    # Le volume est provisionné par le cluster ; sa taille effective peut
    # différer de la demande selon la classe de stockage.
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/volumeClaimTemplates
