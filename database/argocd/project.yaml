# AppProject Argo CD — socle du homelab.
#
# Un projet séparé de ceux des applications : ce qu'il déploie est partagé, et
# son périmètre doit rester lisible d'un coup d'œil.
#
# Il ne reste qu'un seul composant de socle maison sur ce projet : la base
# `database/`, elle-même en cours de retrait (phase 5 — migration vers le
# PostgreSQL mutualisé CloudNativePG). Le projet disparaîtra avec elle. Le
# stockage objet `object-store` et le cache `cache` l'ont déjà quitté ; leurs
# destinations ont donc été retirées.
#
# Rappel Argo : l'AppProject n'est PAS synchronisé par les Applications. Après
# avoir retiré le socle object-store (supprimer d'abord son Application :
# `kubectl delete application object-store -n argocd`), réappliquer ce fichier
# pour aligner le projet vivant :
#   kubectl apply -f database/argocd/project.yaml
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: homelab-platform
  namespace: argocd
spec:
  description: Composants de socle mutualisés du cluster
  sourceRepos:
    - https://github.com/hseb72/homelab-platform.git
    - https://github.com/hseb72/homelab-platform
  destinations:
    - server: https://kubernetes.default.svc
      namespace: database
  # Les charts ne créent qu'une espèce de ressource hors namespace : le
  # Namespace lui-même. On l'énumère plutôt que d'ouvrir en grand.
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
