# Surcouche de production du nœud k3s.
#
# ╔══════════════════════════════════════════════════════════════════════════╗
# ║ À RENSEIGNER AVANT LA PREMIÈRE SYNCHRONISATION — le tag de l'image.       ║
# ║ Le chart refuse de se rendre tant qu'il est vide : c'est voulu, un tag    ║
# ║ inventé donnerait un ImagePullBackOff sans rapport apparent avec la       ║
# ║ cause.                                                                    ║
# ║                                                                          ║
# ║   docker run --rm postgres:latest postgres --version                     ║
# ╚══════════════════════════════════════════════════════════════════════════╝

postgres:
  image:
    tag: "17.2"

backup:
  # Client `mc` du téléversement — même version que celle déjà épinglée pour le
  # stockage objet : un seul client à suivre sur ce cluster.
  mcImage:
    tag: "RELEASE.2025-08-13T08-35-41Z"    # aligné sur le déploiement rental (CNPG postgresql:17.2)
  storage:
    size: 20Gi
    storageClass: local-path
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: 1000m, memory: 1Gi }

networkPolicies:
  enabled: true
  defaultDeny: true
