{{- /*
PostgreSQL, instance unique.

`StatefulSet` et non `Deployment` : le volume porte des données, et un
StatefulSet garantit qu'un seul pod y est attaché à la fois. Un Deployment en
roulement pourrait en démarrer un second sur le même volume — PostgreSQL
refuserait de démarrer sur un répertoire déjà verrouillé, mais le symptôme
serait obscur.

⚠ Deux réglages n'ont PAS pu être éprouvés : l'image PostgreSQL est inaccessible
depuis l'environnement où ce chart a été écrit.
  - `readOnlyRootFilesystem: true`. L'image n'écrit en principe que dans son
    répertoire de données (le volume) et dans les répertoires temporaires
    montés ci-dessous. Si le pod ne démarre pas, c'est le premier bouton à
    relâcher : security.containerSecurityContext.readOnlyRootFilesystem: false.
  - `runAsUser: 999` (l'utilisateur `postgres` de l'image) avec `fsGroup` pour
    le volume. C'est la configuration documentée, mais elle n'a pas été jouée
    ici.
*/}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: postgres
    {{- include "database.labels" . | nindent 4 }}
spec:
  serviceName: postgres
  replicas: {{ .Values.postgres.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: postgres
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.security.podSecurityContext | nindent 8 }}
      containers:
        - name: postgres
          image: {{ include "database.image" . | quote }}
          imagePullPolicy: {{ .Values.postgres.imagePullPolicy }}
          securityContext:
            {{- toYaml .Values.security.containerSecurityContext | nindent 12 }}
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.superuserSecret }}
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.superuserSecret }}
                  key: password
            # PGDATA dans un SOUS-répertoire du volume : monté à la racine, un
            # volume porte un `lost+found` qui ferait échouer l'initdb.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: {{ .Values.postgres.port }}
          # `pg_isready` confirme que le serveur accepte les connexions ; c'est
          # la bonne sonde pour un StatefulSet dont l'initdb du premier
          # démarrage peut prendre un moment.
          startupProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-p", "{{ .Values.postgres.port }}"]
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-p", "{{ .Values.postgres.port }}"]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-p", "{{ .Values.postgres.port }}"]
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            # Système de fichiers racine en lecture seule : on rend écrivables
            # les seuls répertoires dont l'image a besoin en dehors du volume.
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgres.storage.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage.size }}
