apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "database.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
{{- /*
Service stable. Les applications visent `postgres.<namespace>.svc.cluster.local` —
c'est cette adresse qu'elles inscrivent dans leur chaîne de connexion.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: postgres
    {{- include "database.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: postgres
      port: {{ .Values.postgres.port }}
      targetPort: postgres
