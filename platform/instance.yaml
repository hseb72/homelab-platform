# Instance du socle partagé — valeurs pour le chart `platform` de
# platform-patterns (≥ 1.1.0). Ce dépôt est le REPO D'OPS (cf.
# docs/alignement-patterns-1.0.0.md). Aucun secret ici.
#
# ── Phasage ───────────────────────────────────────────────────────────────────
# Phase 1 : datastores + Vault + CNPG (faits).
# Phase 3 : edge activé — `ingress`, `kong`, `routeReport`. BASCULE big-bang à une
#           seule IP publique : retirer l'ancien edge (helm uninstall
#           platform-ingress + kong) AVANT la synchro, sinon le 2ᵉ LoadBalancer
#           reste Pending. Runbook : platform/README.md.

global:
  storageClass: local-path        # k3s

networkPolicies:
  enabled: true

# ── PostgreSQL (CloudNativePG) — ns `postgres` ───────────────────────────────
postgres:
  enabled: true
  namespace: postgres
  createNamespace: true
  clientNamespaceLabel: platform-patterns.io/postgres-client   # défaut, explicite
  operatorNamespace: cnpg-system
  clusterName: postgres           # → service `postgres-rw.postgres.svc`
  instances: 1                    # nœud unique : 1 instance (pas de HILA utile ici)
  storageSize: 20Gi
  parameters:
    max_connections: "200"
    shared_buffers: 256MB
  # Requis pour que le provisionnement self-service des apps crée leurs
  # bases/rôles (le superutilisateur CNPG est dans un Secret géré par CNPG).
  enableSuperuserAccess: true
  monitoring: true                # repris par VictoriaMetrics
  # Sauvegarde/PITR CNPG (barman) vers le MinIO mutualisé (ns `minio`). Remplace
  # la sauvegarde maison du chart `database/` — prérequis à son retrait (phase 5).
  #
  # Hors chart (une fois, cf. README §Sauvegarde CNPG) :
  #   - un seau `postgres-backups` sur le MinIO mutualisé ;
  #   - un Secret `postgres-backup-s3` dans le ns `postgres`, clés `access-key`
  #     et `secret-key` d'un utilisateur MinIO ayant accès à ce seau (scellé).
  # Après activation : déclencher un Backup à la demande et vérifier qu'il arrive
  # dans le seau AVANT de retirer la sauvegarde maison.
  backup:
    enabled: true
    # Dimanche 3 h 05 (décalé de l'heure ronde) : base backup hebdomadaire ;
    # l'archivage WAL continu assure le PITR entre deux.
    schedule: "5 3 * * 0"
    retentionPolicy: 30d
    destinationPath: s3://postgres-backups/
    endpointURL: http://minio.minio.svc.cluster.local:9000
    s3Credentials:
      secretName: postgres-backup-s3
      accessKeyIdKey: access-key
      secretAccessKeyKey: secret-key

# ── MinIO — ns `minio` ───────────────────────────────────────────────────────
minio:
  enabled: true
  namespace: minio
  createNamespace: true
  clientNamespaceLabel: platform-patterns.io/minio-client
  # Même image/tag que la prod, sur quay.io (Docker Hub déprécié par MinIO).
  image: quay.io/minio/minio:RELEASE.2024-12-18T13-15-44Z
  # Secret racine (root-user / root-password), créé HORS chart puis scellé.
  credentialsSecret: platform-minio
  storageSize: 20Gi
  apiPort: 9000
  consolePort: 9001

# ── Redis — ns `redis` ───────────────────────────────────────────────────────
redis:
  enabled: true
  namespace: redis
  createNamespace: true
  clientNamespaceLabel: platform-patterns.io/redis-client
  image: redis:7.4.3             # aligné sur la prod
  storageSize: 1Gi
  port: 6379

# ── App-of-apps : destination Argo des Applications générées ─────────────────
argocd:
  namespace: argocd
  project: platform              # cf. platform/project.yaml
  destinationServer: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

# ── CloudNativePG (opérateur) — ns `cnpg-system` ─────────────────────────────
cnpgOperator:
  enabled: true
  namespace: cnpg-system
  chart:
    repoURL: https://cloudnative-pg.github.io/charts
    name: cloudnative-pg
    version: 0.22.1              # confirmer/relever (prod rental : série 0.23.x)
  # Les CRD CNPG dépassent la limite d'annotation de l'apply client-side ; le
  # Server-Side Apply l'évite (sinon OutOfSync/SyncError permanent). Requiert
  # platform ≥ 1.1.0.
  syncOptions:
    - ServerSideApply=true

# ── Vault (HashiCorp CE) + injector — ns `vault` ─────────────────────────────
# Livré dès la phase 1 ; bootstrap init/unseal + moteur DB hors-bande, une fois.
vault:
  enabled: true
  namespace: vault
  chart:
    repoURL: https://helm.releases.hashicorp.com
    name: vault
    version: 0.28.1
  values:
    injector:
      enabled: true
  # L'injector écrit le caBundle de son webhook à l'exécution → dérive
  # cosmétique ; on l'ignore. Requiert platform ≥ 1.1.0.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - '.webhooks[].clientConfig.caBundle'

# ── Edge ingress (ingress-nginx) — ns `ingress` ──────────────────────────────
# `front` chez les patterns ; renommé `ingress` ici (cf. doc §2). Les apps le
# désignent par `shared.webIngress.controllerNamespace: ingress`.
# Valeurs portées depuis platform-ingress/values-ingress-nginx.yaml (l'edge
# actuel) : classe `nginx`, Service LoadBalancer (même IP nœud), WAF en
# observation, webhook d'admission désactivé.
ingress:
  enabled: true
  namespace: ingress
  chart:
    repoURL: https://kubernetes.github.io/ingress-nginx
    name: ingress-nginx
    version: 4.12.1              # version déjà en prod
  values:
    controller:
      watchNamespaces: ""        # sert toutes les apps
      ingressClassResource:
        name: nginx              # NE PAS renommer : tous les Ingress ciblent `nginx`
        enabled: true
        default: false
        controllerValue: k8s.io/ingress-nginx
      ingressClass: nginx
      service:
        type: LoadBalancer       # k3s ServiceLB → IP du nœud (:80/:443)
      replicaCount: 1
      config:
        # DNAT direct : trafic en TCP nu, pas de proxy_protocol.
        use-proxy-protocol: "false"
        # WAF ModSecurity + CRS OWASP, EN OBSERVATION (cf. platform-ingress/WAF.md).
        enable-modsecurity: "true"
        enable-owasp-modsecurity-crs: "true"
        # ⚠ AUCUN COMMENTAIRE NI APOSTROPHE dans le fragment : ingress-nginx
        # l insere entoure d apostrophes ; la premiere fermerait la chaine.
        modsecurity-snippet: |
          SecRuleEngine DetectionOnly
          SecRequestBodyAccess On
          SecRequestBodyLimit 52428800
          SecRequestBodyNoFilesLimit 1048576
          SecRequestBodyLimitAction ProcessPartial
          SecAuditEngine RelevantOnly
          SecAuditLogParts ABFHZ
          SecAuditLog /dev/stdout
          SecAuditLogFormat JSON
          SecAuditLogType Serial
      # Webhook d'admission désactivé : un ValidatingWebhookConfiguration vers un
      # service disparu bloquerait toute création/màj d'Ingress du cluster.
      admissionWebhooks:
        enabled: false
      resources:
        requests: { cpu: 200m, memory: 512Mi }
        limits:   { cpu: "1",  memory: 1Gi }

# ── Kong (API gateway, Ingress Controller) — ns `kong` ───────────────────────
# Valeurs portées depuis gateway/values-kong.yaml. Kong est DERRIÈRE l'edge
# (ClusterIP, jamais exposé direct) ; ne traite que `/api`.
kong:
  enabled: true
  namespace: kong
  chart:
    repoURL: https://charts.konghq.com
    name: kong
    version: 2.41.1
  values:
    # Fige le nom du Service à `kong-proxy` (sinon préfixé du nom de release).
    fullnameOverride: kong
    image:
      repository: kong
      tag: "3.9"
    env:
      database: "off"            # DB-less : config poussée par le contrôleur d'Ingress
    ingressController:
      enabled: true
      ingressClass: kong         # classe dédiée ; les Ingress `nginx` ne sont pas happés
      watchNamespaces: []        # toutes : chaque app déclare ses routes chez elle
    proxy:
      type: ClusterIP
      http:
        enabled: true
        servicePort: 80
        containerPort: 8000
      tls:
        enabled: false           # TLS terminé par l'edge en amont
    admin:
      # Service supprimé (API d'admin injoignable d'ailleurs) MAIS écouteur local
      # gardé : le contrôleur d'Ingress pousse la config par là. Tout couper
      # bloque le pod en 0/2 sans message clair.
      enabled: false
      http:
        enabled: true
        containerPort: 8001
      tls:
        enabled: false
    manager:   { enabled: false }
    portal:    { enabled: false }
    portalapi: { enabled: false }
    status:
      enabled: true
      http:
        enabled: true
        containerPort: 8100
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits:   { cpu: "1",  memory: 512Mi }
    replicaCount: 1
    serviceMonitor:
      enabled: false             # la stack VM utilise VMServiceScrape

# ── Report de routes (page HTML privée) — ns `route-report` ──────────────────
routeReport:
  enabled: true
  namespace: route-report
  createNamespace: true
  schedule: "*/15 * * * *"
