apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cache
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  # Le projet homelab-platform est partagé par tous les composants de socle ; il
  # est livré avec object-store et admet le namespace `cache`.
  project: homelab-platform
  source:
    repoURL: https://github.com/hseb72/homelab-platform.git
    targetRevision: main
    path: cache
    helm:
      releaseName: cache
      valueFiles:
        - values.yaml
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: cache
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff: { duration: 15s, factor: 2, maxDuration: 5m }
  ignoreDifferences:
    # Le volume est provisionné par le cluster ; sa taille effective peut
    # différer de la demande selon la classe de stockage.
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/volumeClaimTemplates
