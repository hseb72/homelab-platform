apiVersion: v1
kind: ServiceAccount
metadata:
  name: redis
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "cache.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
{{- /*
Service stable. Les applications visent `redis.<namespace>.svc.cluster.local` —
c'est cette adresse qu'elles inscrivent dans leur configuration de cache.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: redis
    {{- include "cache.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: redis
      port: {{ .Values.redis.port }}
      targetPort: redis
