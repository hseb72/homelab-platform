{{- if .Values.provision.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: provision-script
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "cache.labels" . | nindent 4 }}
data:
  provision.sh: |
    #!/bin/sh
    # Provisionnement des locataires du cache mutualisé.
    #
    # Rejoué à chaque synchronisation : il doit donc être idempotent, et le
    # rester même si l'état du cluster a dérivé à la main.
    set -eu

    HOST="redis.{{ .Values.namespace }}.svc.cluster.local"
    PORT="{{ .Values.redis.port }}"
    R="redis-cli -h $HOST -p $PORT --no-auth-warning"

    # Redis peut être encore en train de démarrer : on attend qu'il réponde —
    # que ce soit par PONG (default ouvert, première installation) ou par NOAUTH
    # (default déjà coupé, l'ACL a survécu au redémarrage).
    echo "→ attente du cache…"
    i=0
    until $R PING 2>&1 | grep -qE 'PONG|NOAUTH'; do
      i=$((i + 1))
      [ "$i" -gt 60 ] && { echo "✗ cache injoignable après 5 minutes"; exit 1; }
      sleep 5
    done
    echo "  cache joignable."

    # Poser (ou faire tourner) l'administrateur, puis s'authentifier avec lui
    # pour tout le reste. Deux chemins :
    #   — installation : `default` est ouvert, on crée `admin` par lui ;
    #   — synchronisation : `admin` existe déjà, on l'utilise directement.
    if $R --user admin -a "$ADMIN_PASS" PING 2>/dev/null | grep -q PONG; then
      echo "  administrateur reconnu."
    else
      echo "  amorçage de l'administrateur (default ouvert)."
      $R ACL SETUSER admin on ">$ADMIN_PASS" allkeys allchannels allcommands >/dev/null
    fi

    # À partir d'ici, toute commande passe par le compte administrateur.
    adm() { $R --user admin -a "$ADMIN_PASS" "$@"; }

    # Rotation du mot de passe administrateur : la clé du secret fait foi.
    adm ACL SETUSER admin on ">$ADMIN_PASS" allkeys allchannels allcommands >/dev/null

    # Crée (ou met à jour) un locataire : un compte borné à ses seules clés
    # `<nom>:*`, sans les commandes dangereuses (FLUSHALL, CONFIG, KEYS…).
    # `reset` d'abord : l'état déclaré ici fait foi, une clé retirée du secret
    # ne laisse pas traîner un ancien mot de passe.
    provisionner() {
      nom="$1"
      cle_fichier="/tenant-keys/$nom"

      if [ ! -s "$cle_fichier" ]; then
        echo "✗ $nom : aucune clé dans le secret {{ .Values.provision.tenantKeysSecret }}"
        echo "  (attendu : une entrée nommée « $nom »)"
        return 1
      fi
      cle="$(cat "$cle_fichier")"

      adm ACL SETUSER "$nom" reset on ">$cle" "~$nom:*" resetchannels +@all -@dangerous >/dev/null
      echo "  compte $nom → clés $nom:*"
    }

    echec=0
    {{- range .Values.tenants }}
    echo "→ locataire {{ .name }}"
    provisionner {{ .name }} || echec=1
    {{- end }}

    # Refermer l'utilisateur `default` (ouvert le temps de l'amorçage), puis
    # graver l'ensemble dans le fichier d'ACL pour qu'il survive au redémarrage.
    adm ACL SETUSER default off >/dev/null
    adm ACL SAVE >/dev/null
    echo "  default coupé, ACL enregistrées."

    [ "$echec" -eq 0 ] || { echo "✗ au moins un locataire n'a pas été provisionné"; exit 1; }
    echo "✓ provisionnement terminé"
{{- end }}
