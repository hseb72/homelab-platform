# Ingress de classe `nginx`, dans le namespace `gateway` : amène les hôtes d'API
# depuis le bord jusqu'à Kong.
#
# Pourquoi ici et pas dans le namespace de l'application : un Ingress ne peut
# référencer qu'un Service de son propre namespace, et `kong-proxy` vit dans
# `gateway`. C'est donc ce fichier qui grandit d'une entrée par application —
# la seule ressource centralisée du dispositif, et elle ne contient que des
# noms d'hôtes.
#
# ⚠ Aucune annotation touchant l'en-tête `Host` (pas d'`upstream-vhost`, pas de
# réécriture) : la résolution de tenant en dépend, et une normalisation ferait
# répondre 404 à tous les sites tenants.
#
# PHASE 1 — hôte temporaire, la production ne passe pas par là.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gw
  namespace: gateway
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-http01
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api-gw.xpms.crealcs.com
      secretName: api-gw-tls
  rules:
    - host: api-gw.xpms.crealcs.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kong-proxy
                port:
                  number: 80
