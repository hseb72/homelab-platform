apiVersion: v1
kind: ServiceAccount
metadata:
  name: minio
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "objectstore.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
{{- /*
Service stable. Les applications visent `minio.<namespace>.svc.cluster.local` —
c'est cette adresse qu'elles inscrivent dans leur configuration de sauvegarde.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: minio
    {{- include "objectstore.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: minio
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: api
      port: {{ .Values.minio.ports.api }}
      targetPort: api
    - name: console
      port: {{ .Values.minio.ports.console }}
      targetPort: console
