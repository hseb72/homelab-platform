# Surcouche de production du nœud k3s.
#
# ╔══════════════════════════════════════════════════════════════════════════╗
# ║ À RENSEIGNER AVANT LA PREMIÈRE SYNCHRONISATION — les deux tags d'image.  ║
# ║ Le chart refuse de se rendre tant qu'ils sont vides : c'est voulu, un    ║
# ║ tag inventé donnerait un ImagePullBackOff sans rapport apparent avec la  ║
# ║ cause.                                                                   ║
# ║                                                                          ║
# ║   docker run --rm minio/minio:latest --version                           ║
# ║   docker run --rm minio/mc:latest --version                              ║
# ╚══════════════════════════════════════════════════════════════════════════╝

minio:
  image:
    tag: "RELEASE.2024-12-18T13-15-44Z"   # aligné sur le déploiement rental
  storage:
    size: 20Gi
    storageClass: local-path
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits:   { cpu: 1000m, memory: 1Gi }

provision:
  image:
    # ⚠ À RENSEIGNER — le client `mc` a sa PROPRE ligne de release (pas le même
    # timestamp que le serveur). Relever un tag récent sur quay.io/minio/mc, ou :
    #   docker run --rm quay.io/minio/mc:latest --version
    # Un mc récent convient (client) — il n'a pas à coïncider avec le serveur.
    tag: ""        # RELEASE.… (quay.io/minio/mc)

networkPolicies:
  enabled: true
  defaultDeny: true
