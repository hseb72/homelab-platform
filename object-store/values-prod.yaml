# Surcouche de production du nœud k3s.
#
# ╔══════════════════════════════════════════════════════════════════════════╗
# ║ À RENSEIGNER AVANT LA PREMIÈRE SYNCHRONISATION — les deux tags d'image.  ║
# ║ Le chart refuse de se rendre tant qu'ils sont vides : c'est voulu, un    ║
# ║ tag inventé donnerait un ImagePullBackOff sans rapport apparent avec la  ║
# ║ cause.                                                                   ║
# ║                                                                          ║
# ║   docker run --rm minio/minio:latest --version                           ║
# ║   docker run --rm minio/mc:latest --version                              ║
# ╚══════════════════════════════════════════════════════════════════════════╝

minio:
  image:
    tag: "RELEASE.2024-12-18T13-15-44Z"   # aligné sur le déploiement rental
  storage:
    size: 20Gi
    storageClass: local-path
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits:   { cpu: 1000m, memory: 1Gi }

provision:
  image:
    # Client `mc` (quay.io/minio/mc) — sa propre ligne de release, indépendante
    # du serveur ; un mc récent convient pour le provisionnement.
    tag: "RELEASE.2025-08-13T08-35-41Z"

networkPolicies:
  enabled: true
  defaultDeny: true
