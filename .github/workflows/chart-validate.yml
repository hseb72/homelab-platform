name: Chart Validate

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: chart-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Plus aucun chart maison à rendre depuis le retrait des backends de socle
  # (object-store, database, cache — phase 5), et le moteur d'edge est désormais
  # instancié par charts/platform. Ne reste, côté manifests bruts de CE dépôt,
  # que l'Ingress des hôtes d'API centralisés (edge/api-hosts.yaml), appliqué à
  # la main : on vérifie qu'il est conforme au schéma Kubernetes et que les
  # valeurs du socle (platform/instance.yaml) parsent.
  edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Conformité de l'Ingress des hôtes d'API au schéma Kubernetes
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -ignore-missing-schemas -summary edge/api-hosts.yaml

      - name: Les valeurs du socle parsent
        run: |
          python3 -c "import yaml; list(yaml.safe_load_all(open('platform/instance.yaml'))); print('platform/instance.yaml : OK')"
