name: Chart Validate

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: chart-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helm:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Chaque composant déclare les tags d'image que la CI doit fournir
          # pour rendre le chart : ils sont volontairement vides dans le dépôt.
          - chart: object-store
            setargs: --set minio.image.tag=CI --set provision.image.tag=CI
          - chart: database
            setargs: --set postgres.image.tag=CI
          - chart: cache
            setargs: --set redis.image.tag=CI
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Lint et rendu
        run: |
          helm lint ${{ matrix.chart }}/ ${{ matrix.setargs }}
          helm template ${{ matrix.chart }} ${{ matrix.chart }}/ -n ${{ matrix.chart }} \
            ${{ matrix.setargs }} > /tmp/rendu.yaml
          echo "$(grep -c '^kind:' /tmp/rendu.yaml) objets rendus"

      - name: Le tag vide doit faire échouer le rendu
        run: |
          # Ce garde-fou est le cœur du dispositif : sans lui, un chart rendu
          # avec un tag vide produirait une image « repository: » invalide.
          if helm template ${{ matrix.chart }} ${{ matrix.chart }}/ -n ${{ matrix.chart }} >/dev/null 2>&1; then
            echo "::error::Le chart ${{ matrix.chart }} se rend sans tag d'image — le garde-fou a sauté."
            exit 1
          fi
          echo "Garde-fou en place."

      - name: Conformité au schéma Kubernetes
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -ignore-missing-schemas -summary /tmp/rendu.yaml

      - name: Syntaxe des scripts de provisionnement
        run: |
          python3 - <<'PY' > /tmp/provision.sh
          import yaml
          for d in yaml.safe_load_all(open('/tmp/rendu.yaml')):
              if d and d.get('kind') == 'ConfigMap' and 'provision.sh' in d.get('data', {}):
                  print(d['data']['provision.sh'])
          PY
          # Aucun script (composant sans provisionnement) : rien à vérifier.
          if [ -s /tmp/provision.sh ]; then
            sh -n /tmp/provision.sh && echo "script valide"
          else
            echo "aucun script de provisionnement"
          fi

      - name: Aucun secret en clair
        run: |
          if grep -qE '^kind: Secret$' /tmp/rendu.yaml; then
            echo "::error::Le chart ${{ matrix.chart }} rend un Secret — ils doivent rester hors de Git."
            exit 1
          fi
          echo "Aucun Secret rendu."
