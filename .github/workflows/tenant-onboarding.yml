name: Onboarding locataire

# Le guichet du socle : une issue « Nouveau locataire » devient une PR.
#
# Le travail est fait par des scripts (scripts/issue-to-args.py →
# scripts/add-tenant.py), pas par un modèle : zéro consommation de quota dans le
# cas nominal. Claude n'intervient qu'en REPLI, quand le script refuse la
# demande (champ invalide, locataire déjà déclaré, cas non prévu) — et alors
# seulement pour expliquer le refus en commentaire, plafonné en tours, sans droit
# d'écriture sur le dépôt.
#
# Prérequis (une fois) :
#  - l'étiquette `nouveau-locataire` (gh label create nouveau-locataire) ;
#  - Settings → Actions → « Allow GitHub Actions to create and approve pull
#    requests » ;
#  - pour le repli seulement : le secret CLAUDE_CODE_OAUTH_TOKEN
#    (`claude setup-token`). Sans lui, le repli est simplement sauté.

on:
  issues:
    types: [opened, labeled]

permissions: {}

# `opened` et `labeled` arrivent ensemble quand le formulaire pose l'étiquette :
# on les sérialise, et le second constate que la branche existe déjà.
concurrency:
  group: onboarding-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  guichet:
    # Seul le propriétaire du dépôt ouvre le guichet : le corps de l'issue est
    # du texte libre, et le job a le droit de pousser.
    if: >-
      contains(github.event.issue.labels.*.name, 'nouveau-locataire') &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write          # relancer Chart Validate sur la branche
      id-token: write         # jeton de l'app Claude (repli uniquement)
    env:
      A_REPLI: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Déclarer le locataire (script)
        id: script
        env:
          CORPS: ${{ github.event.issue.body }}
        run: |
          python3 scripts/issue-to-args.py \
            --kit-dir /tmp/kit --summary /tmp/resume.md 2> /tmp/script.log \
            || { cat /tmp/script.log; exit 1; }
          cat /tmp/script.log

      - name: Déjà traité ?
        id: deja
        env:
          NOM: ${{ steps.script.outputs.name }}
        run: |
          if git ls-remote --exit-code --heads origin "tenant/$NOM" >/dev/null; then
            echo "La branche tenant/$NOM existe déjà : rien à refaire."
            echo "oui=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Valider le rendu
        if: steps.deja.outputs.oui != 'true'
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          helm template database database/ -n database \
            --set postgres.image.tag=CI --set backup.mcImage.tag=CI > /tmp/db.yaml
          helm template object-store object-store/ -n object-store \
            --set minio.image.tag=CI --set provision.image.tag=CI > /tmp/os.yaml
          helm template cache cache/ -n cache --set redis.image.tag=CI > /tmp/cache.yaml
          ./kubeconform -strict -ignore-missing-schemas -summary \
            /tmp/db.yaml /tmp/os.yaml /tmp/cache.yaml gateway/[0-9]*-*.yaml /tmp/kit/*.yaml

      - name: Ouvrir la PR
        if: steps.deja.outputs.oui != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NOM: ${{ steps.script.outputs.name }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          branche="tenant/$NOM"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branche"
          git add database/values.yaml object-store/values.yaml cache/values.yaml \
                  gateway/10-ingress-api-hosts.yaml
          git commit -m "Locataire $NOM (guichet, #$ISSUE)"
          git push -u origin "$branche"
          { cat /tmp/resume.md; echo; echo "Closes #$ISSUE"; } > /tmp/corps.md
          url="$(gh pr create --head "$branche" --title "Locataire $NOM" --body-file /tmp/corps.md)"
          gh issue comment "$ISSUE" --body "PR ouverte : $url"
          # Une PR ouverte avec GITHUB_TOKEN ne déclenche pas `pull_request` :
          # on relance la validation explicitement sur la branche.
          gh workflow run chart-validate.yml --ref "$branche"

      # ── Repli : seulement si le script a refusé, et seulement pour expliquer. ──
      - name: Repli — diagnostic par Claude
        if: failure() && steps.script.outcome == 'failure' && env.A_REPLI == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Dépôt ${{ github.repository }}, issue #${{ github.event.issue.number }}.
            Le script scripts/add-tenant.py a refusé cette demande de locataire.
            Son message est dans /tmp/script.log. Lis-le, lis l'issue
            (`gh issue view ${{ github.event.issue.number }}`) et, si utile,
            scripts/add-tenant.py et les values.yaml concernés.

            Poste UN commentaire sur l'issue, en français, court :
            la cause du refus, et la correction exacte à apporter au formulaire
            (ou, si la demande sort du cadre du script — p. ex. ajouter un seau à
            un locataire existant —, le diff à faire à la main).
            Ne modifie aucun fichier, n'ouvre aucune PR.
          claude_args: |
            --model sonnet
            --max-turns 6
            --allowedTools Read,Grep,Glob,Bash(cat /tmp/script.log),Bash(gh issue view:*),Bash(gh issue comment:*)

      - name: Signaler le refus (sans repli)
        if: failure() && steps.script.outcome == 'failure' && env.A_REPLI != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          { echo "Le guichet a refusé la demande :"; echo; echo '```'; cat /tmp/script.log; echo '```'; } > /tmp/refus.md
          gh issue comment "$ISSUE" --body-file /tmp/refus.md
