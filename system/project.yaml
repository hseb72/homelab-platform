# AppProject `system` — outillage de plateforme (SSO, Argo CD, mesure d'audience).
#
# Isolé des applications ET du socle : ce projet ne gouverne que les namespaces
# d'outillage. Objectif (cf. system/README.md) : sortir ce tooling de l'install
# xpms pour qu'il vive indépendamment.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: system
  namespace: argocd
spec:
  description: Outillage de plateforme (SSO Keycloak, Argo CD, Matomo) — isolé des applications
  sourceRepos:
    - https://github.com/hseb72/homelab-platform.git
  destinations:
    - { server: https://kubernetes.default.svc, namespace: sso }
    - { server: https://kubernetes.default.svc, namespace: argocd }   # frontal UI (ingress)
    - { server: https://kubernetes.default.svc, namespace: matomo }   # mesure d'audience
    # (le monitoring est une release Helm CLI, pas une Application Argo.)
  # Le SSO et Matomo n'ont que des ressources namespacées (Deployment, StatefulSet,
  # Service, Ingress, CronJob, NetworkPolicy, Cluster CNPG, VMServiceScrape, VMRule).
  # Pas de cluster-scoped → liste vide (le ns est créé par CreateNamespace).
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - { group: "*", kind: "*" }
