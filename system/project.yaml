# AppProject `system` — outillage de plateforme (SSO, puis Argo CD, monitoring).
#
# Isolé des applications ET du socle : ce projet ne gouverne que les namespaces
# d'outillage. Objectif (cf. system/README.md) : sortir ce tooling de l'install
# xpms pour qu'il vive indépendamment.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: system
  namespace: argocd
spec:
  description: Outillage de plateforme (SSO Keycloak ; à venir Argo CD, monitoring) — isolé des applications
  sourceRepos:
    - https://github.com/hseb72/homelab-platform.git
  destinations:
    - { server: https://kubernetes.default.svc, namespace: sso }
    # À venir, au fil de l'extraction :
    # - { server: https://kubernetes.default.svc, namespace: argocd }
    # - { server: https://kubernetes.default.svc, namespace: monitoring }
  # Le SSO n'a que des ressources namespacees (Deployment, Service, Ingress,
  # Cluster CNPG, Certificate). Pas de cluster-scoped → liste vide.
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - { group: "*", kind: "*" }
