# Ingress + certificat TLS de Matomo, via l'edge du socle (classe `nginx`,
# cert-manager HTTP-01). Un seul hôte, schéma `*.system.crealcs.com` du tooling :
#   - stats.system.crealcs.com : appelé par les navigateurs des visiteurs (matomo.js,
#     matomo.php), inscrit dans la configuration des applications, et console
#     d'administration. NE PAS renommer.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: matomo
  namespace: matomo
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-http01
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
spec:
  ingressClassName: nginx
  tls:
    - secretName: matomo-crealcs-tls
      hosts: [stats.system.crealcs.com]
  rules:
    - host: stats.system.crealcs.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: matomo, port: { number: 80 } } }
