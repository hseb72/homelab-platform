# Ingress + certificats TLS de Matomo, via l'edge du socle (classe `nginx`,
# cert-manager HTTP-01). Même schéma que le SSO :
#   - stats.crealcs.com          : hôte CANONIQUE, appelé par les navigateurs des
#                                  visiteurs (matomo.js, matomo.php) et inscrit dans
#                                  la configuration des applications. NE PAS renommer.
#   - matomo.system.crealcs.com  : alias d'administration (schéma *.system).
# Certificats séparés : si l'un échoue l'ACME, l'autre reste valide.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: matomo
  namespace: matomo
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-http01
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
spec:
  ingressClassName: nginx
  tls:
    - secretName: matomo-crealcs-tls
      hosts: [stats.crealcs.com]
    - secretName: matomo-system-tls
      hosts: [matomo.system.crealcs.com]
  rules:
    - host: stats.crealcs.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: matomo, port: { number: 80 } } }
    - host: matomo.system.crealcs.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: matomo, port: { number: 80 } } }
