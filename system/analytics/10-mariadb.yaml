# Base MariaDB dédiée à Matomo (Matomo ne fonctionne pas sur PostgreSQL ; le socle
# n'a pas de MySQL). Une instance, ressources basses. Principe system/ : chaque outil
# a sa propre base.
#
# Secret `matomo-db` (hors Git, cf. README) : root-password, password (utilisateur
# `matomo`), exporter-password (utilisateur `exporter` de mysqld-exporter).
apiVersion: v1
kind: ConfigMap
metadata:
  name: mariadb-init
  namespace: matomo
data:
  # Exécuté une seule fois, à l'initialisation du volume (docker-entrypoint-initdb.d).
  # Volume déjà initialisé : créer l'utilisateur à la main (README, « Base existante »).
  10-exporter.sh: |
    #!/bin/sh
    set -e
    mariadb -uroot -p"$MARIADB_ROOT_PASSWORD" <<SQL
    CREATE USER IF NOT EXISTS 'exporter'@'localhost' IDENTIFIED BY '${EXPORTER_PASSWORD}' WITH MAX_USER_CONNECTIONS 3;
    GRANT PROCESS, REPLICATION CLIENT, SELECT ON *.* TO 'exporter'@'localhost';
    SQL
---
apiVersion: v1
kind: Service
metadata:
  name: mariadb
  namespace: matomo
  labels: { app.kubernetes.io/name: mariadb }
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: mariadb }
  ports:
    - { name: mysql, port: 3306 }
    - { name: metrics, port: 9104 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb
  namespace: matomo
spec:
  serviceName: mariadb
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: mariadb }
  template:
    metadata:
      labels: { app.kubernetes.io/name: mariadb }
    spec:
      containers:
        - name: mariadb
          # renovate: datasource=docker depName=docker.io/library/mariadb versioning=loose
          image: docker.io/library/mariadb:11.4.13
          args: ['--max-allowed-packet=64M']
          env:
            - { name: MARIADB_DATABASE, value: matomo }
            - { name: MARIADB_USER, value: matomo }
            - name: MARIADB_PASSWORD
              valueFrom: { secretKeyRef: { name: matomo-db, key: password } }
            - name: MARIADB_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: matomo-db, key: root-password } }
            - name: EXPORTER_PASSWORD
              valueFrom: { secretKeyRef: { name: matomo-db, key: exporter-password } }
          ports: [{ name: mysql, containerPort: 3306 }]
          readinessProbe:
            exec: { command: ['healthcheck.sh', '--connect', '--innodb_initialized'] }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 768Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/mysql }
            - { name: init, mountPath: /docker-entrypoint-initdb.d }
        # Métriques MariaDB pour VictoriaMetrics (60-monitoring.yaml).
        - name: exporter
          # renovate: datasource=docker depName=docker.io/prom/mysqld-exporter
          image: docker.io/prom/mysqld-exporter:v0.21.0
          args: ['--mysqld.address=127.0.0.1:3306', '--mysqld.username=exporter']
          env:
            - name: MYSQLD_EXPORTER_PASSWORD
              valueFrom: { secretKeyRef: { name: matomo-db, key: exporter-password } }
          ports: [{ name: metrics, containerPort: 9104 }]
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
      volumes:
        - name: init
          configMap: { name: mariadb-init, defaultMode: 0555 }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 5Gi } }
