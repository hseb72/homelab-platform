# Cloisonnement du ns `matomo` (défense en profondeur ; les ns d'outillage ne sont pas
# fermés par défaut) :
#   - MariaDB : seulement depuis le ns `matomo` (Matomo, sauvegarde) ; métriques depuis
#     `monitoring` ;
#   - Matomo  : seulement depuis l'edge (ns `ingress`).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mariadb-matomo-only
  namespace: matomo
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: mariadb }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
      ports: [{ port: 3306 }]
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: monitoring }
      ports: [{ port: 9104 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: matomo-from-edge
  namespace: matomo
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: matomo }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress }
      ports: [{ port: 80 }]
