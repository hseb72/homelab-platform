# Matomo (image officielle Apache) et son archivage horaire.
#
# Le volume `matomo-html` porte le code (copié au premier démarrage par l'image),
# `config/config.ini.php`, les plugins (dont LoginOIDC) et le cache. RWO : un seul
# pod, stratégie Recreate ; l'archiveur est un conteneur du même pod.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: matomo-html
  namespace: matomo
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 5Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: matomo
  namespace: matomo
  labels: { app.kubernetes.io/name: matomo }
spec:
  selector: { app.kubernetes.io/name: matomo }
  ports: [{ name: http, port: 80 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matomo
  namespace: matomo
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: matomo }
  template:
    metadata:
      labels: { app.kubernetes.io/name: matomo }
    spec:
      containers:
        - name: matomo
          # renovate: datasource=docker depName=docker.io/library/matomo versioning=loose
          image: docker.io/library/matomo:5.14.2-apache
          env:
            - { name: MATOMO_DATABASE_HOST, value: mariadb.matomo.svc.cluster.local }
            - { name: MATOMO_DATABASE_DBNAME, value: matomo }
            - { name: MATOMO_DATABASE_USERNAME, value: matomo }
            - name: MATOMO_DATABASE_PASSWORD
              valueFrom: { secretKeyRef: { name: matomo-db, key: password } }
          ports: [{ name: http, containerPort: 80 }]
          readinessProbe:
            httpGet: { path: /matomo.js, port: http }
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /matomo.js, port: http }
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 768Mi }
          volumeMounts: [{ name: html, mountPath: /var/www/html }]
        # Archivage des rapports toutes les heures (l'archivage déclenché par les
        # visites est coupé dans Matomo, cf. README). Passe le premier tour tant que
        # l'installation n'est pas faite.
        - name: archiver
          # Même image que le conteneur matomo (Renovate met les deux à jour ensemble).
          # renovate: datasource=docker depName=docker.io/library/matomo versioning=loose
          image: docker.io/library/matomo:5.14.2-apache
          command: ['sh', '-c']
          args:
            - |
              while true; do
                sleep 3600
                if [ -f /var/www/html/config/config.ini.php ]; then
                  su -s /bin/sh www-data -c \
                    "php /var/www/html/console core:archive --url=https://stats.crealcs.com" \
                    && echo "archivage terminé" || echo "archivage en échec"
                fi
              done
          resources:
            requests: { cpu: 20m, memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts: [{ name: html, mountPath: /var/www/html }]
      volumes:
        - name: html
          persistentVolumeClaim: { claimName: matomo-html }
